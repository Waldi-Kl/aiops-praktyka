{{- if .Values.loadgen.enabled }}
{{- $component := "loadgen" }}
{{- $svc := .Values.loadgen }}
{{- $ctx := dict "ctx" $ "component" $component "svc" $svc "version" (toString $svc.image.tag) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kantyna.componentName" $ctx }}
  labels:
    {{- include "kantyna.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $svc.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "kantyna.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kantyna.labels" $ctx | nindent 8 }}
        {{- with $svc.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- with $svc.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kantyna.serviceAccountName" $ctx }}
      securityContext:
        {{- include "kantyna.podSecurityContext" (dict "ctx" $ "svc" $svc) | nindent 8 }}
      {{- with (include "kantyna.podScheduling" $ | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ include "kantyna.image" (dict "ctx" $ "image" $svc.image) | quote }}
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ $svc.metrics.port }}
              protocol: TCP
          env:
            {{- include "kantyna.commonEnv" $ctx | nindent 12 }}
            - name: METRICS_PORT
              value: {{ $svc.metrics.port | quote }}
            - name: BASE_URL
              value: {{ default (printf "http://%s:%d" (include "kantyna.componentName" (dict "ctx" $ "component" "orders-api")) (int .Values.ordersApi.service.port)) $svc.baseUrl | quote }}
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- include "kantyna.containerSecurityContext" (dict "ctx" $ "svc" $svc) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
{{- end }}
