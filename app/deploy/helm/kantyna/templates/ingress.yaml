{{- if and .Values.ingress.enabled .Values.web.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kantyna.componentName" (dict "ctx" $ "component" "web") }}
  labels:
    {{- include "kantyna.labels" (dict "ctx" $ "component" "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kantyna.componentName" (dict "ctx" $ "component" "web") }}
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
